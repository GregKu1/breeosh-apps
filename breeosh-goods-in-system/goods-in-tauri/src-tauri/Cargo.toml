[package]
name = "goods-in-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "goods_in_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebView2's default window.print() opens the native OS print dialog, which
# has no preview and (per manual testing) rasterizes our label SVGs as solid
# black blocks. ShowPrintUI(BROWSER) forces the Chromium print-preview dialog
# instead, which renders correctly.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

